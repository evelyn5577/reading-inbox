0UEkgYsaVKIP4O/iSdhUBkccrVBNqb2iWz+dvyPljs=";const ITER=600000;const KEY="reading-inbox-pages-pass";
function store(fn){try{return fn()}catch{return null}}
async function unlock(password){
  const raw=Uint8Array.from(atob(PAYLOAD),c=>c.charCodeAt(0));const salt=raw.slice(8,16),data=raw.slice(16);
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveBits"]);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},base,384));
  const key=await crypto.subtle.importKey("raw",bits.slice(0,32),"AES-CBC",false,["decrypt"]);
  const zipped=await crypto.subtle.decrypt({name:"AES-CBC",iv:bits.slice(32)},key,data);

async function attempt(password,remember){
  const btn=document.getElementById("go"),msg=document.getElementById("msg");btn.disabled=true;msg.textContent="";
